<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="50%" stop-color="#DD2476" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#799F0C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <!-- Speech bubble -->
    <path d="M120 160 C120 115 156 80 200 80 L312 80 C356 80 392 115 392 160 L392 270 C392 315 356 350 312 350 L220 350 L150 410 L160 350 L200 350 C156 350 120 315 120 270 Z" fill="#FFFFFF" />
