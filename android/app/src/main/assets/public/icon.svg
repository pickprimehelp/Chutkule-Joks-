    <path d="M277 200 Q302 175 327 200" stroke="#DD2476" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Big joyful smile -->
    <path d="M190 235 Q256 305 322 235" stroke="#DD2476" stroke-width="14" stroke-linecap="round" fill="#FFCCD5" />
    <path d="M215 270 Q256 305 297 270" fill="#E11D48" />
