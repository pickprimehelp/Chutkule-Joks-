name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK & AAB (Play Store Ready)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Web Frontend
        run: npm run build

      - name: 🔄 Prepare & Sync Android Assets (Capacitor)
        run: |
          if [ -f "scripts/prepare-android.js" ]; then
            node scripts/prepare-android.js
          else
            if [ ! -d "android" ]; then
              npx cap add android
            fi
            npx cap sync android
          fi
          chmod +x android/gradlew

      - name: 🔑 Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'chutkule123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'chutkule' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'chutkule123' }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          else
            echo "Generating release signing key..."
            rm -f android/app/release.jks
            keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ChutkuleApp, OU=Mobile, O=Chutkule, L=Delhi, S=Delhi, C=IN"
          fi
          ls -lh android/app/release.jks

      - name: 🚀 Build Debug APK, Release APK & Play Store AAB
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'chutkule123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'chutkule' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'chutkule123' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon

      - name: 📂 Collect & Verify APK and AAB Outputs
        run: |
          rm -rf android-artifacts
          mkdir -p android-artifacts

          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -n "$DEBUG_APK" ]; then cp "$DEBUG_APK" android-artifacts/Chutkule-Vichar-Debug.apk; fi
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" android-artifacts/Chutkule-Vichar-Release.apk; fi
          if [ -n "$RELEASE_AAB" ]; then cp "$RELEASE_AAB" android-artifacts/Chutkule-Vichar-PlayStore.aab; fi

          if [ -f android/app/release.jks ]; then
            cp android/app/release.jks android-artifacts/chutkule-release.jks
          fi

          echo "=== Verified Build Artifacts ==="
          ls -lh android-artifacts/

          test -s android-artifacts/Chutkule-Vichar-Debug.apk
          test -s android-artifacts/Chutkule-Vichar-Release.apk
          test -s android-artifacts/Chutkule-Vichar-PlayStore.aab

      - name: 📤 Upload All Build Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Chutkule-Vichar-Android-APK-AAB
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: 📱 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chutkule-Vichar-Debug-APK
          path: android-artifacts/Chutkule-Vichar-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chutkule-Vichar-Release-APK
          path: android-artifacts/Chutkule-Vichar-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏪 Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chutkule-Vichar-PlayStore-AAB
          path: android-artifacts/Chutkule-Vichar-PlayStore.aab
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish Direct APK & AAB Links on GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chutkule & Vichar Android v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            android-artifacts/Chutkule-Vichar-Debug.apk
            android-artifacts/Chutkule-Vichar-Release.apk
            android-artifacts/Chutkule-Vichar-PlayStore.aab

      - name: 📝 Output Download Guide in Summary
        run: |
          echo "## 🎉 Android APK & AAB Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts (नीचे 'Artifacts' सेक्शन में डाउनलोड करें):" >> $GITHUB_STEP_SUMMARY
          echo "- **Chutkule-Vichar-Release-APK**: फ़ोन में डायरेक्ट इंस्टॉल करने के लिए Signed Release APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Chutkule-Vichar-Debug-APK**: टेस्टिंग के लिए Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Chutkule-Vichar-PlayStore-AAB**: Google Play Store पर अपलोड करने के लिए AAB बंडल" >> $GITHUB_STEP_SUMMARY
          echo "- **Chutkule-Vichar-Android-APK-AAB**: सभी फाइलें + Keystore एक साथ" >> $GITHUB_STEP_SUMMARY
